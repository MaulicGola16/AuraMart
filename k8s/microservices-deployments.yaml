apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-gateway
  template:
    metadata:
      labels:
        app: frontend-gateway
    spec:
      containers:
      - name: frontend-gateway
        image: <your-dockerhub-username>/auramart-frontend-gateway:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: auramart-microservices-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: <your-dockerhub-username>/auramart-catalog-service:latest
        ports:
        - containerPort: 5001
