apiVersion: v1
kind: Service
metadata:
  name: frontend-gateway
spec:
  type: LoadBalancer
  selector:
    app: frontend-gateway
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
  - port: 5001
    targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
  - port: 5002
    targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
spec:
  type: ClusterIP
  selector:
    app: recommendation-service
  ports:
  - port: 5003
    targetPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot-service
  ports:
  - port: 5004
    targetPort: 5004